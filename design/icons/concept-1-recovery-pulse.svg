<?xml version="1.0" encoding="UTF-8"?>
<!-- lifeline icon · Concept 1 "Recovery Pulse" · Direction 4 Dark-Field Emissive
     A heartbeat/ECG line that flatlines, then recovers into a rising beat. The one
     moment the whole app is about: the line was going under, and it comes back.
     Layers map 1:1 to Icon Composer: bg / mid / fg / highlight. Full-bleed 1024, no
     baked corner mask or drop shadow (the system applies them). -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="c1-ground" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1B2530"/>
      <stop offset="55%" stop-color="#121A24"/>
      <stop offset="100%" stop-color="#0B1017"/>
    </radialGradient>
    <linearGradient id="c1-pulse" x1="120" y1="512" x2="904" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E9C86"/>
      <stop offset="52%" stop-color="#19E39A"/>
      <stop offset="100%" stop-color="#5BF2C6"/>
    </linearGradient>
    <radialGradient id="c1-bloom" cx="63%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#19E39A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#19E39A" stop-opacity="0"/>
    </radialGradient>
    <filter id="c1-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- bg: emissive-cushion tile (rim light + vignette so it reads as a cushion, not a print) -->
  <g id="bg">
    <rect width="1024" height="1024" fill="url(#c1-ground)"/>
    <rect x="8" y="8" width="1008" height="1008" rx="220" fill="none" stroke="#2B3947" stroke-width="3" stroke-opacity="0.6"/>
    <rect x="8" y="8" width="1008" height="1008" rx="220" fill="none" stroke="#000000" stroke-width="10" stroke-opacity="0.25"/>
  </g>

  <!-- mid: the halo the recovered beat throws into the black -->
  <g id="mid">
    <circle cx="628" cy="474" r="360" fill="url(#c1-bloom)"/>
  </g>

  <!-- fg: the pulse. Flat baseline on the left (going under), a dip, then the recovery beat.
       Drawn as one continuous stroke so the silhouette names the subject at a glance. -->
  <g id="fg" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- soft under-glow of the line -->
    <path d="M150 548 L360 548 L432 596 L500 548 L560 548 L628 300 L690 620 L742 476 L812 476 L874 476"
          stroke="#19E39A" stroke-opacity="0.5" stroke-width="70" filter="url(#c1-soft)"/>
    <!-- the line itself -->
    <path d="M150 548 L360 548 L432 596 L500 548 L560 548 L628 300 L690 620 L742 476 L812 476 L874 476"
          stroke="url(#c1-pulse)" stroke-width="40"/>
    <!-- the live beat node: a bright dot at the peak = the agent brought back -->
    <circle cx="628" cy="300" r="30" fill="#EAFFF6"/>
    <circle cx="628" cy="300" r="30" fill="url(#c1-pulse)" fill-opacity="0.35"/>
  </g>

  <!-- highlight: top rim on the beat + a droppable specular. Under a Tinted variant this
       layer drops out and the pulse silhouette still names the app. -->
  <g id="highlight">
    <path d="M560 548 L628 300 L690 620" fill="none" stroke="#DFFFF2" stroke-opacity="0.65"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
